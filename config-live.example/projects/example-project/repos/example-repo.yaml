# Example repo configuration — rename this file to `<repo.id>.yaml` when you
# copy this template.

repo:
  id: "example-repo"
  name: "Example Repository"
  enabled: true

vcs:
  provider: "github"                # or "gitlab"
  github:
    token: "${GITHUB_TOKEN}"
    owner: "your-org"
    repo: "your-repo"
    default_branch: "main"
    branch_prefix: "feature"
    merge_method: "squash"

ci:
  provider: "github_actions"        # or "jenkins"

git:
  clone_url: "https://${GITHUB_TOKEN}@github.com/your-org/your-repo.git"
  commit_author_name: "Cleave Bot"
  commit_author_email: "cleave@pipeline.local"
  depth: 1

architecture:
  # Optional path to an architecture rules file agents must follow.
  rules_file: "docs/arch-rules.md"
  # Files/dirs agents must never modify.
  protected_files:
    - ".github/"
    - "build.gradle.kts"
    - "settings.gradle.kts"

linting:
  run_command: "./gradlew detekt"
  hard_gate: true

testing:
  run_command: "./gradlew test"
  hard_gate: true

build:
  check_command: "./gradlew assembleDebug"
  hard_gate: true

# Optional: paths to your existing helper scripts. Leave empty to skip.
helpers:
  fetch_pr_comments: ""
  resolve_pr_comments: ""
  fetch_ci_failure: ""
  fetch_jira_tickets: ""
  update_jira_status: ""
  code_review: ""
  create_jira_ticket: ""

jira_repo_label: "example-repo"

pr_description_template: |
  ## {ticket_id}

  Automated PR created by Cleave pipeline.

  **Jira:** ${JIRA_URL}/browse/{ticket_id}

  ### Checklist
  - [x] Implementation plan followed
  - [x] Scope guard passed
  - [x] QA gates passed (tests, lint, build)
  - [ ] Code review
  - [ ] Human merge

parallelism:
  max_concurrent_tickets: 2

# Optional: reviewer mode (reviews colleagues' PRs). Validated only when enabled.
reviewer:
  enabled: false
  base_branch: develop
  poll_interval_seconds: 300
  quiet_minutes: 30
  max_files_auto: 40
  readiness:
    kind: command                                   # later: rule
    # The board shows the PRs this lists: those that involve you, or every open PR when the tool takes "--all".
    status_command: ["python3", "tools/threads/threads.py", "--repo", "{repo}", "status"]
    threads_command: ["python3", "tools/threads/threads.py", "--repo", "{repo}", "threads", "{pr}"]
  process:
    doc: docs/review/code-review-process.md         # repo-relative, read from base_branch
    prepare_section: "Prepare"                       # heading Cleave replaces and hashes
    recheck_section: "Re-check"
    run_dir: "tools/review/runs/PR_{pr}"             # where the document expects its artifacts
    replies_plan: "tools/threads/runs/PR_{pr}/replies_{head9}.json"
    worktree_dir: "../review-wt/PR_{pr}"             # relative to the review clone
    # Prepare steps run on the host with HOME, outside the session's sandbox. A step that builds or runs the
    # PR's own code (`cd {worktree} && ./gradlew ...`) runs PR-authored code there. The config guard stops only
    # scripts in the session-writable directories and launcher operands in the worktree.
    prepare_steps:
      - ["python3", "tools/review/anchors.py", "{pr}", "--worktree", "{worktree}", "--base", "{merge_base}"]
    helper_scripts: ["tools/review/*.py"]            # python3 targets the model may run
    # Threads on your own PRs: Cleave drafts the replies and a fix with this author-side document ("" = turn lines).
    # address_doc: ".github/pr_comments/400-pr-review-workflow.mdc"
  poster:
    kind: command
    review_command: ["python3", "tools/review/post.py", "{pr}", "--repo", "{repo}", "--report", "{report}",
                     "--anchors", "{job_dir}/anchors.json", "--ledger", "{ledger}", "--event", "{event}"]
    replies_command: ["python3", "tools/threads/threads.py", "--repo", "{repo}", "post", "{pr}", "--plan", "{plan}"]
    dry_run_flag: "--dry-run"
    confirm_flag: "--yes"

# Optional: the skill flow, which works a ticket in one `claude` session running the repo's own skill.
# Validated only when ticket_flow is both; GitHub repos only.
# ticket_flow: both            # staged (default) | both
# skill_flow:
#   bug_skill: fix-this        # the repo's skill for bug tickets
#   task_skill: implement-this # the repo's skill for every other ticket
