# Example project configuration — rename the directory to match `project.id`
# when you copy this template to your own `config-live/projects/<id>/`.

project:
  id: "example-project"
  name: "Example Project"
  enabled: true

jira:
  url: "${JIRA_URL}"
  token: "${JIRA_TOKEN}"
  email: "${JIRA_EMAIL}"
  project_key: "EXPROJ"             # Your Jira project key (uppercase)
  trigger_labels: ["ai-pipeline"]   # Tickets must carry ALL of these labels to run
  ignore_labels:
    - "manual-only"
    - "blocked"
  statuses:
    todo: "To Do"
    in_progress: "In Progress"
    in_review: "In Review"          # where the ticket goes once its PR is open (any status of your workflow)
    done: "Done"
  # A move to a status with no transition from where the ticket is steps only through these statuses, in order.
  # Without them Cleave takes direct transitions only (it never guesses a step).
  # transition_via: ["Ready For Development", "In Progress"]

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  default_chat_id: "${TELEGRAM_CHAT_ID}"
  # The language the bot writes in Telegram: en or uk. Without it, the project follows global.yaml's (English
  # when that has none).
  # language: "uk"

parallelism:
  max_concurrent_tickets: 3

defaults:
  poll_interval_seconds: 300
  max_iterations:
    scope_guard: 3
    fix: 3
    qa: 2
    dev: 2
  pr_comment_fetch_delay_minutes: 30
