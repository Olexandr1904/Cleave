workflow:
  id: "default"
  name: "Standard Ticket Pipeline"
  description: "Full ticket lifecycle: analysis -> plan review -> dev -> scope check -> code review -> qa -> push -> pr review -> done"

stages:
  - id: "analysis"
    agent: "ba-agent"
    description: "Validate requirements, create implementation plan"
    next: "plan_review"
    on_unclear: "escalate"

  # The plan is what scope_check, code_review and qa all measure against, and
  # scope_check takes its file allowlist straight out of it. A defect here is
  # invisible to every later gate: the diff matches its spec, tests go green,
  # and the wrong feature ships. Cold context on purpose — a judge that resumes
  # the author's session inherits the author's justifications.
  - id: "plan_review"
    agent: "plan-review-agent"
    description: "Review the plan itself, before any code exists"
    on_pass: "dev"
    on_fail: "analysis"
    max_iterations: 2
    on_max_iterations: "escalate"

  - id: "dev"
    agent: "dev-agent"
    description: "Implement code on feature branch"
    next: "scope_check"
    # Re-entered after a scope/review/qa bounce, dev resumes its own earlier
    # session instead of starting cold — otherwise it cannot remember why the
    # code looks the way it does and rewrites rather than patches. Judging
    # stages (scope_check, code_review) deliberately do NOT resume.
    resume_from_previous: true
    # Counts every dev entry, including bounces from scope_check and qa.
    # Was previously uncapped — runs that kept getting bounced (e.g.
    # scope-guard fix → qa-bounce fix) burned unbounded $$.
    max_iterations: 3
    on_max_iterations: "escalate"

  - id: "scope_check"
    agent: "scope-guard-agent"
    description: "Validate diff against plan and arch rules"
    on_pass: "code_review"
    on_fail: "dev"
    max_iterations: 2        # consecutive failures only — counter resets on pass (see orchestrator.py)
    on_max_iterations: "escalate"

  # Owns correctness. scope_check judges boundaries, qa judges coverage —
  # before this stage existed, nothing asked whether the code was right, and
  # seven real defects shipped on PR #1509 with every gate green.
  - id: "code_review"
    agent: "code-review-agent"
    description: "Review the diff for behavioural defects before tests are written"
    on_pass: "qa"
    on_fail: "dev"
    max_iterations: 2
    on_max_iterations: "escalate"

  - id: "qa"
    agent: "qa-agent"
    description: "Write tests, run quality suite (test/lint/build)"
    on_pass: "push"
    on_fail: "dev"
    max_iterations: 2
    on_max_iterations: "escalate"

  - id: "push"
    action: "push_and_open_pr"
    description: "Push branch and open PR"
    next: "pr_review"

  - id: "pr_review"
    action: "fetch_pr_comments"
    description: "Fetch and analyze PR review comments"
    delay_minutes: 30
    on_fix_required: "dev"
    on_done: "done"
    max_iterations: 3
    on_max_iterations: "escalate"

  - id: "escalate"
    action: "notify_human"
    description: "Send Telegram notification, wait for reply"
    on_reply: "resume_previous"

  - id: "done"
    action: "finalize"
    description: "Notify completion, await human merge"
